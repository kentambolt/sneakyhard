<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Every Tile Once</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* Sister games on one board: physical tiles on a cool ground, cobalt and amber for the pieces, ice as a glossy surface. */
  :root {
    --ground: #dde3e1;
    --panel: #e8edeb;
    --line: #c2cbc7;
    --hole: #c3ccc8;
    --tile: #f8f7f2;
    --tile-edge: #b0bab6;
    --ink: #2340c8;
    --amber: #b8650f;
    --used-a: #d9def3;
    --used-b: #f1e1cc;
    --won-a: #bfc9f5;
    --won-b: #ecc89b;
    --ice-1: #c9e6ef;
    --ice-2: #f1fbfd;
    --ice-edge: #9fcad8;
    --perm: #56625e;
    --perm-edge: #36403d;
    --perm-mark: #7a8782;
    --ink-contrast: #ffffff;
    --text: #17201d;
    --muted: #56635e;
    --danger: #c2402b;
    --good: #1f7a4a;
    --good-ink: #ffffff;
    --sans: "Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #0f1517;
      --panel: #162024;
      --line: #2a373c;
      --hole: #263236;
      --tile: #2a3539;
      --tile-edge: #070b0c;
      --ink: #8da1ff;
      --amber: #f0a64a;
      --used-a: #1d2650;
      --used-b: #3b2a15;
      --won-a: #2b3a85;
      --won-b: #6a4518;
      --ice-1: #163640;
      --ice-2: #2a5b69;
      --ice-edge: #0b2229;
      --perm: #7c8b90;
      --perm-edge: #2b3539;
      --perm-mark: #9eacb1;
      --ink-contrast: #0f1517;
      --text: #e6edea;
      --muted: #8f9d98;
      --danger: #ff7c66;
      --good: #63cf93;
      --good-ink: #0f1517;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0f1517;
    --panel: #162024;
    --line: #2a373c;
    --hole: #263236;
    --tile: #2a3539;
    --tile-edge: #070b0c;
    --ink: #8da1ff;
    --amber: #f0a64a;
    --used-a: #1d2650;
    --used-b: #3b2a15;
    --won-a: #2b3a85;
    --won-b: #6a4518;
    --ice-1: #163640;
    --ice-2: #2a5b69;
    --ice-edge: #0b2229;
    --perm: #7c8b90;
    --perm-edge: #2b3539;
    --perm-mark: #9eacb1;
    --ink-contrast: #0f1517;
    --text: #e6edea;
    --muted: #8f9d98;
    --danger: #ff7c66;
    --good: #63cf93;
    --good-ink: #0f1517;
  }

  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.45;
    padding-inline: 16px;
    -webkit-tap-highlight-color: transparent;
  }
  .app {
    max-width: 1060px;
    margin: 0 auto;
    padding-block: 22px 40px;
  }
  .view { display: grid; gap: 18px; }

  .brand {
    margin: 0;
    font-size: clamp(34px, 5vw, 52px);
    font-weight: 800;
    font-variation-settings: "wdth" 76, "opsz" 96;
    letter-spacing: -0.025em;
    line-height: 0.92;
    text-wrap: balance;
  }
  .brand em { font-style: normal; color: var(--ink); }
  .brand .b { color: var(--amber); }
  .brand .perm { color: var(--perm); }
  .brand .ice {
    color: var(--ink);
    background: linear-gradient(120deg, var(--ink) 0%, var(--ink) 40%, var(--ice-edge) 50%, var(--ink) 60%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* ---------- home ---------- */
  .hero { display: grid; gap: 12px; padding-block: 12px 6px; }
  .hero .brand { font-size: clamp(44px, 8vw, 88px); }
  .lede { margin: 0; max-width: 58ch; color: var(--muted); font-size: 17px; text-wrap: pretty; }
  .cards {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
    padding-top: 8px;
  }
  .card {
    display: grid;
    grid-template-rows: auto auto 1fr auto;
    gap: 12px;
    padding: 18px;
    border-radius: 16px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: inherit;
    text-align: left;
    font: inherit;
    cursor: pointer;
    min-width: 0;
  }
  .card:hover { border-color: var(--ink); }
  .card.wide { grid-column: span 2; grid-template-columns: 150px minmax(0, 1fr); grid-template-rows: auto auto 1fr; column-gap: 22px; }
  .card.wide .mini { grid-row: 1 / span 3; align-self: start; }
  .card.wide .meta { grid-column: 2; }
  .card h2 {
    margin: 0;
    font-size: 30px;
    font-weight: 800;
    font-variation-settings: "wdth" 78, "opsz" 96;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .card p { margin: 0; color: var(--muted); }
  .card .meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    font: 500 12.5px/1.2 var(--mono);
    color: var(--muted);
  }
  .card .go { color: var(--ink); font-weight: 600; }
  .mini {
    --w: 5; --h: 5;
    display: grid;
    grid-template-columns: repeat(var(--w), minmax(0, 1fr));
    grid-template-rows: repeat(var(--h), minmax(0, 1fr));
    gap: 3px;
    width: min(100%, 150px);
    aspect-ratio: var(--w) / var(--h);
  }
  .mini span { min-width: 0; min-height: 0; overflow: hidden; border-radius: 22%; position: relative; display: grid; place-items: center; font: 600 10px/1 var(--mono); color: var(--muted); }
  .mini .t { background: var(--tile); box-shadow: 0 2px 0 var(--tile-edge); }
  .mini .p { background: var(--perm); box-shadow: 0 2px 0 var(--perm-edge); }
  .mini .p.sa::after, .mini .p.sb::after { content: ""; position: absolute; inset: 28%; border-radius: 50%; background: var(--ink); }
  .mini .p.sb::after { background: var(--amber); }
  .mini .i { background: linear-gradient(135deg, var(--ice-1), var(--ice-2) 50%, var(--ice-1)); }
  .mini .t.sa::after, .mini .t.sb::after {
    content: "";
    position: absolute;
    inset: 28%;
    border-radius: 50%;
    background: var(--ink);
  }
  .mini .t.sb::after { background: var(--amber); }
  /* ---------- game view ---------- */
  .top {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 10px 32px;
  }
  .title-block { display: grid; gap: 6px; }
  .back {
    justify-self: start;
    padding: 4px 0;
    border: 0;
    background: none;
    color: var(--muted);
    font: 500 13px/1 var(--mono);
    cursor: pointer;
  }
  .back:hover { color: var(--ink); }
  .tagline { margin: 0; color: var(--muted); max-width: 50ch; text-wrap: balance; }

  .levels {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
    padding-block: 10px;
    border-block: 1px solid var(--line);
  }
  .group { display: flex; align-items: center; gap: 6px; }
  .group-label { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-right: 2px; }
  .chip {
    position: relative;
    min-width: 36px;
    height: 36px;
    padding: 0 10px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    font: 500 14px/1 var(--mono);
    cursor: pointer;
  }
  .chip:hover { border-color: var(--ink); }
  .chip[aria-current="true"] { background: var(--ink); border-color: var(--ink); color: var(--ink-contrast); }
  .chip.solved::after {
    content: "";
    position: absolute;
    right: -3px;
    top: -3px;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--good);
    border: 2px solid var(--ground);
  }

  .play {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
    gap: 32px;
    align-items: start;
  }
  .board-wrap { display: flex; justify-content: center; min-width: 0; }
  .board {
    --w: 5; --h: 5;
    --lift: calc(100cqw / var(--w) * 0.065);
    position: relative;
    container-type: inline-size;
    width: min(100%, 580px, max(300px, calc((100dvh - 230px) * var(--w) / var(--h))));
    aspect-ratio: var(--w) / var(--h);
    display: grid;
    grid-template-columns: repeat(var(--w), 1fr);
    grid-template-rows: repeat(var(--h), 1fr);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    outline: none;
    border-radius: 12px;
  }
  .board:focus-visible { box-shadow: 0 0 0 2px var(--ground), 0 0 0 4px var(--ink); }
  .cell { position: relative; }
  .cell.tile::before {
    content: "";
    position: absolute;
    inset: 6% 6% 9%;
    border-radius: 19%;
    background: var(--tile);
    box-shadow: 0 var(--lift) 0 var(--tile-edge);
    transition: transform 140ms ease, background-color 200ms ease, box-shadow 140ms ease;
  }
  .cell.used-a::before, .cell.used-b::before { box-shadow: 0 0 0 var(--tile-edge); transform: translateY(var(--lift)); }
  .cell.used-a::before { background: var(--used-a); }
  .cell.used-b::before { background: var(--used-b); }
  .cell.hole::before {
    content: "";
    position: absolute;
    inset: 16% 16% 19%;
    border-radius: 22%;
    border: 1.5px dashed var(--hole);
  }
  .cell.ice::before {
    content: "";
    position: absolute;
    inset: 4% 4% 4%;
    border-radius: 14%;
    background:
      linear-gradient(135deg, transparent 0 38%, var(--ice-2) 38% 44%, transparent 44% 52%, var(--ice-2) 52% 55%, transparent 55%),
      linear-gradient(160deg, var(--ice-1), var(--ice-2) 55%, var(--ice-1));
    box-shadow: inset 0 0 0 1.5px var(--ice-edge);
    transform: translateY(var(--lift));
  }
  .cell.perm::before {
    content: "";
    position: absolute;
    inset: 6% 6% 9%;
    border-radius: 19%;
    background:
      linear-gradient(var(--perm-mark), var(--perm-mark)) center / 38% 7% no-repeat,
      linear-gradient(var(--perm-mark), var(--perm-mark)) center / 7% 38% no-repeat,
      var(--perm);
    box-shadow: 0 var(--lift) 0 var(--perm-edge);
  }
  .cell .num {
    position: absolute;
    inset: 6% 6% 9%;
    display: grid;
    place-items: center;
    font: 700 calc(100cqw / var(--w) * 0.36)/1 var(--mono);
    color: var(--text);
    opacity: 0.55;
    pointer-events: none;
    transition: transform 140ms ease, opacity 200ms ease, color 160ms ease;
  }
  .cell.num-next .num { color: var(--ink); opacity: 1; }
  .cell.used-a .num, .cell.used-b .num { transform: translateY(var(--lift)); opacity: 0.3; }
  .cell.has-num.next-a::after, .cell.has-num.next-b::after { display: none; }
  .cell.next-a::after, .cell.next-b::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 48.5%;
    width: 15%;
    aspect-ratio: 1;
    border-radius: 50%;
    opacity: 0.4;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .cell.ice.next-a::after, .cell.ice.next-b::after { top: 56.5%; opacity: 0.55; }
  .cell.next-a::after { background: var(--ink); }
  .cell.next-b::after { background: var(--amber); }
  .cell.next-a, .cell.next-b { cursor: pointer; }
  @media (hover: hover) {
    .path-mode .cell.tile.next-a:hover::before { transform: translateY(calc(var(--lift) * -0.4)); }
  }
  .ink {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: visible;
  }
  .ink polyline { fill: none; stroke-width: 0.2; stroke-linecap: round; stroke-linejoin: round; display: none; }
  .board.revealed .ink polyline { display: inline; }
  .ink .trail-a { stroke: var(--ink); }
  .ink .trail-b { stroke: var(--amber); }
  .ink .ring { fill: none; stroke-width: 0.045; opacity: 0.55; }
  .ink .ring-a { stroke: var(--ink); }
  .ink .ring-b { stroke: var(--amber); }
  .ink .piece circle { stroke: var(--tile); stroke-width: 0.07; transition: fill 160ms ease, opacity 160ms ease; }
  .ink .piece-a circle { fill: var(--ink); }
  .ink .piece-b circle { fill: var(--amber); }
  .ink .piece.blocked circle { animation: nudge 240ms ease; }
  .board.stuck .piece circle { fill: var(--danger); }
  .board.bump { animation: bump 220ms ease; }
  .board.stuck { animation: shake 380ms ease; }
  @keyframes bump { 30% { transform: scale(0.992); } }
  @keyframes nudge { 40% { opacity: 0.45; } }
  @keyframes shake {
    20% { transform: translateX(-5px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(2px); }
  }
  .board.won .cell.used-a::before, .board.won .cell.used-b::before {
    animation: ripple 520ms ease both;
    animation-delay: calc(var(--i) * var(--step, 35ms));
  }
  .board.won .cell.used-a::before { --rip: var(--ink); --end: var(--won-a); }
  .board.won .cell.used-b::before { --rip: var(--amber); --end: var(--won-b); }
  @keyframes ripple {
    0% { transform: translateY(var(--lift)); }
    45% { transform: translateY(calc(var(--lift) * -0.6)); background: var(--rip); }
    100% { transform: translateY(var(--lift)); background: var(--end); }
  }

  .side { display: grid; gap: 18px; align-content: start; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .lvl-title {
    margin: 2px 0 0;
    font-size: 44px;
    font-weight: 750;
    font-variation-settings: "wdth" 80, "opsz" 96;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .progress { display: grid; gap: 8px; }
  .count {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  .count b { color: var(--text); font-weight: 600; }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--ink); border-radius: 3px; transition: width 160ms ease; }
  .two .bar i { background: linear-gradient(90deg, var(--ink), var(--amber)); }
  .status { margin: 0; min-height: 2.9em; font-size: 16px; font-weight: 500; text-wrap: pretty; }
  .status.bad { color: var(--danger); }
  .status.good { color: var(--good); }

  .actions { display: grid; gap: 14px; }
  .btn {
    justify-self: start;
    min-width: 150px;
    height: 46px;
    padding: 0 22px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    font: 650 15px/1 var(--sans);
    cursor: pointer;
    transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease;
  }
  .btn:hover { border-color: var(--ink); }
  /* stuck: Restart is the only way forward */
  .btn.alert { background: var(--ink); border-color: var(--ink); color: var(--ink-contrast); }
  /* level solved: the button turns green and moves on */
  .btn.go { background: var(--good); border-color: var(--good); color: var(--good-ink); }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .keys { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.5; }

  /* info icon and rules (mobile only; on larger screens the rules sit under the title) */
  .info {
    display: none;
    place-items: center;
    flex: none;
    width: 36px;
    height: 36px;
    margin-left: auto;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    background: transparent;
    color: var(--muted);
    font: 700 17px/1 var(--sans);
    cursor: pointer;
  }
  .info-panel {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: grid;
    place-items: end center;
    padding: 16px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    background: color-mix(in srgb, var(--ground) 60%, transparent);
  }
  .info-card {
    width: min(100%, 520px);
    display: grid;
    gap: 10px;
    padding: 18px;
    border-radius: 16px;
    border: 1px solid var(--line);
    background: var(--panel);
    box-shadow: 0 12px 32px rgb(0 0 0 / 0.18);
  }
  .info-card h2 { margin: 0; font-size: 20px; font-weight: 750; }
  .info-card p { margin: 0; }
  .info-card .close-hint { color: var(--muted); font-size: 13px; }

  @media (max-width: 860px) {
    .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 780px) {
    /* home: compact grid without descriptions */
    .app { padding-block: 12px; }
    .hero { padding-block: 4px 0; gap: 6px; }
    .hero .brand { font-size: clamp(36px, 11vw, 48px); }
    .lede { font-size: 15px; }
    .cards { gap: 10px; padding-top: 4px; }
    .card { padding: 12px; gap: 8px; grid-template-rows: auto auto auto; }
    .card p, .card .go { display: none; }
    .card h2 { font-size: 22px; }
    .card .mini { width: min(100%, 96px); gap: 2px; }
    .mini span { font-size: 8px; }

    /* game: everything on one screen, no scrolling */
    #game { height: calc(100vh - 24px); height: calc(100dvh - 24px); display: flex; flex-direction: column; gap: 10px; }
    .top { flex-wrap: nowrap; align-items: center; gap: 12px; }
    .title-block { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
    .title-block .brand { font-size: 28px; white-space: nowrap; }
    .tagline { display: none; }
    .info { display: grid; }
    .levels { flex: none; flex-wrap: nowrap; overflow-x: auto; gap: 6px 14px; padding-block: 6px; scrollbar-width: none; }
    .levels::-webkit-scrollbar { display: none; }
    .group { flex: none; }
    .chip { min-width: 32px; height: 32px; padding: 0 8px; font-size: 13px; }
    .play { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: stretch; gap: 10px; }
    .board-wrap { flex: 1; min-height: 0; container-type: size; display: grid; place-items: center; }
    .board { width: min(100cqw, calc(100cqh * var(--w) / var(--h))); }
    .side { display: flex; flex: none; }
    .side > :not(.actions) { display: none; }
    .actions { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
    .status { flex: 1; min-width: 0; min-height: 0; font-size: 14px; line-height: 1.3; }
    .btn { flex: none; min-width: 112px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

<main class="app">
  <section class="view" id="home">
    <header class="hero">
      <h1 class="brand">Every Tile <em>Once</em></h1>
      <p class="lede">Six simple games, one rule: use every tile exactly once.</p>
    </header>
    <div class="cards" id="cards"></div>
  </section>

  <section class="view" id="game" hidden>
    <header class="top">
      <div class="title-block">
        <button class="back" id="back" type="button">← All games</button>
        <h1 class="brand" id="gameName"></h1>
      </div>
      <p class="tagline" id="gameRules"></p>
      <button class="info" id="info" type="button" aria-label="How to play" aria-controls="infoPanel">i</button>
    </header>

    <nav class="levels" id="levels" aria-label="Levels"></nav>

    <section class="play">
      <div class="board-wrap">
        <div class="board" id="board" tabindex="0" aria-label="Game board. Use the arrow keys to move."></div>
      </div>

      <aside class="side" id="side">
        <div>
          <div class="eyebrow" id="lvlEyebrow"></div>
          <h2 class="lvl-title" id="lvlTitle"></h2>
        </div>

        <div class="progress">
          <div class="count"><span><b id="cnt">1</b> / <span id="tot">0</span> tiles · <span id="moves">0</span> moves</span><span id="fails"></span></div>
          <div class="bar"><i id="bar"></i></div>
        </div>

        <div class="actions">
          <p class="status" id="status" aria-live="polite"></p>
          <button class="btn" id="restart" type="button">Restart</button>
        </div>

        <p class="keys" id="keys"></p>
      </aside>
    </section>

    <div class="info-panel" id="infoPanel" role="dialog" aria-modal="true" aria-labelledby="infoTitle" hidden>
      <div class="info-card">
        <h2 id="infoTitle">How to play</h2>
        <p id="infoRules"></p>
        <p id="infoKeys"></p>
        <p class="close-hint">Tap anywhere to close.</p>
      </div>
    </div>

(() => {
  // The public version (docs/) is built with PUBLIC = true: no "show solution" and no solutions in the page.
  const PUBLIC = true;
  const $ = (id) => document.getElementById(id);
  const fmt = (x) => Number(x).toLocaleString('en-US');
  const SVGNS = 'http://www.w3.org/2000/svg';
  const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0], DIRS = 'URDL';
  const HOLE = 0, TILE = 1, ICE = 2, PERM = 3;

  // ---------- shared level helpers ----------
  // '#' tile, '.' hole, '~' ice, '+' crossing, '1'-'9' checkpoints in order, 'S'/'A' first piece, 'B' second piece, 'a'/'b' a piece starting on a crossing
  function parseGrid(lv) {
    const w = lv.w, h = lv.h, type = new Uint8Array(w * h), num = new Int8Array(w * h);
    let n = 0, ice = 0, perm = 0, a = -1, b = -1;
    lv.rows.forEach((row, y) => [...row].forEach((ch, x) => {
      const i = y * w + x;
      type[i] = ch === '.' ? HOLE : ch === '~' ? ICE : (ch === '+' || ch === 'a' || ch === 'b') ? PERM : TILE;
      if (type[i] === TILE) n++;
      if (type[i] === ICE) ice++;
      if (type[i] === PERM) perm++;
      if (ch >= '1' && ch <= '9') num[i] = +ch;
      if (ch === 'S' || ch === 'A' || ch === 'a') a = i;
      if (ch === 'B' || ch === 'b') b = i;
    }));
    const nb = (c, d) => {
      const x = c % w + DX[d], y = Math.floor(c / w) + DY[d];
      return x < 0 || y < 0 || x >= w || y >= h ? -1 : y * w + x;
    };
    return { w, h, N: w * h, type, num, n, ice, perm, a, b, nb };
  }
  const dirBetween = (B, from, to) => { for (let d = 0; d < 4; d++) if (B.nb(from, d) === to) return d; return -1; };

  // ---------- One Path and Checkpoints ----------
  function makeVej(lv) {
    const B = parseGrid(lv), start = B.a;
    const path = [start], used = new Uint8Array(B.N);
    used[start] = 1;
    let numDone = 0; // checkpoints taken so far
    const head = () => path[path.length - 1];
    // a checkpoint can only be entered when it is its turn
    const open = (c) => c >= 0 && B.type[c] === TILE && !used[c] && (!B.num[c] || B.num[c] === numDone + 1);
    const add = (c) => { path.push(c); used[c] = 1; if (B.num[c]) numDone++; };
    const pop = () => { const c = path.pop(); used[c] = 0; if (B.num[c]) numDone--; };
    const sol = lv.sol ? lv.sol.slice(1).map((c, k) => DIRS[dirBetween(B, lv.sol[k], c)]).join('') : '';
    return {
      B, input: 'path', two: false, solution: sol, revealStep: Math.max(45, 1800 / B.n),
      used: () => path.length,
      moves: () => path.length - 1,
      canUndo: () => path.length > 1,
      won: () => path.length === B.n,
      canDir: (d) => open(B.nb(head(), d)),
      stuck() { return !this.won() && ![0, 1, 2, 3].some(d => this.canDir(d)); },
      dir(d) {
        const t = B.nb(head(), d);
        if (open(t)) { add(t); return { ok: true }; }
        if (path.length > 1 && t === path[path.length - 2]) { this.undo(); return { ok: true }; }
        return { ok: false };
      },
      undo() { if (path.length > 1) pop(); },
      // drag to draw with the mouse or a finger
      touch(c, isDown) {
        if (c < 0 || c === head()) return false;
        const d = dirBetween(B, head(), c);
        if (d >= 0 && open(c)) { add(c); return true; }
        if (path.length > 1 && c === path[path.length - 2]) { this.undo(); return true; }
        if (isDown && used[c]) { const k = path.indexOf(c); while (path.length > k + 1) pop(); return true; }
        return false;
      },
      solverState: () => ({ used: path.slice(), pos: [head()] }),
      stuckMsg: (left) => left === 1 ? 'So close! One tile left, but there is no way to it.' : `Stuck with ${left} tiles left.`,
      serialize: () => path.slice(1).map((c, k) => DIRS[dirBetween(B, path[k], c)]).join(''),
      scene() {
        const own = new Uint8Array(B.N), order = new Int32Array(B.N), next = [];
        path.forEach((c, k) => { own[c] = 1; order[c] = k; });
        for (let d = 0; d < 4; d++) { const t = B.nb(head(), d); if (open(t)) next.push([t, 'a']); }
        let numNext = -1;
        for (let c = 0; c < B.N; c++) if (B.num[c] === numDone + 1) numNext = c;
        return { own, order, next, numNext, trails: [['a', path]], pieces: [['a', head()]], rings: [['a', start]] };
      },
    };
  }

  // ---------- Lockstep ----------
  function makeTakt(lv) {
    const B = parseGrid(lv);
    let a = B.a, b = B.b, used = 2;
    const owner = new Uint8Array(B.N), order = new Int32Array(B.N), hist = [];
    owner[a] = 1; owner[b] = 2;
    const target = (c, d) => { const t = B.nb(c, d); return t >= 0 && B.type[t] === TILE && !owner[t] ? t : -1; };
    return {
      B, input: 'dir', two: true, solution: lv.sol || '', revealStep: 260,
      used: () => used,
      moves: () => hist.length,
      canUndo: () => hist.length > 0,
      won: () => used === B.n,
      canDir: (d) => target(a, d) >= 0 || target(b, d) >= 0,
      stuck() { return !this.won() && ![0, 1, 2, 3].some(d => this.canDir(d)); },
      dir(d) {
        const ta = target(a, d), tb = target(b, d);
        if (ta < 0 && tb < 0) return { ok: false };
        hist.push({ d, pa: a, pb: b, ma: ta >= 0, mb: tb >= 0 });
        if (ta >= 0) { owner[ta] = 1; order[ta] = hist.length; a = ta; used++; }
        if (tb >= 0) { owner[tb] = 2; order[tb] = hist.length; b = tb; used++; }
        return { ok: true, blocked: ta < 0 ? 0 : tb < 0 ? 1 : -1 };
      },
      undo() {
        const h = hist.pop();
        if (!h) return;
        if (h.ma) { owner[a] = 0; used--; }
        if (h.mb) { owner[b] = 0; used--; }
        a = h.pa; b = h.pb;
      },
      pieces: () => [a, b],
      solverState() {
        const used = [];
        for (let c = 0; c < B.N; c++) if (owner[c]) used.push(c);
        return { used, pos: [a, b] };
      },
      stuckMsg: (left) => left === 1 ? 'So close! One tile left, but neither piece can reach it.' : `Stuck with ${left} tiles left.`,
      serialize: () => hist.map(h => DIRS[h.d]).join(''),
      scene() {
        const own = owner.slice(), next = [];
        for (let d = 0; d < 4; d++) {
          const ta = target(a, d), tb = target(b, d);
          if (ta >= 0) next.push([ta, 'a']);
          if (tb >= 0) next.push([tb, 'b']);
        }
        const pa = [B.a], pb = [B.b];
        let ca = B.a, cb = B.b;
        for (const h of hist) {
          if (h.ma) { ca = B.nb(ca, h.d); pa.push(ca); }
          if (h.mb) { cb = B.nb(cb, h.d); pb.push(cb); }
        }
        return { own, order, next, trails: [['a', pa], ['b', pb]], pieces: [['a', a], ['b', b]], rings: [['a', B.a], ['b', B.b]] };
      },
    };
  }

  // ---------- Black Ice, Crossroads and The Gauntlet: one shared engine ----------
  // 1-2 pieces sharing one control, optional checkpoints. Tiles are used once; ice and crossings never disappear.
  // On ice you keep sliding until you hit something you cannot step on (stop on the ice) or a tile/crossing (stop there).
  // When the pieces are in the same line, the front one moves first.
  function makeMix(lv) {
    const B = parseGrid(lv);
    const two = B.b >= 0;
    let pos = two ? [B.a, B.b] : [B.a];
    const starts = pos.slice();
    const own = new Uint8Array(B.N), order = new Int32Array(B.N), hist = [];
    let used = 0;
    let numDone = 0; // checkpoints taken so far
    pos.forEach((p, k) => { if (B.type[p] === TILE) { own[p] = k + 1; used++; } });
    const prog = (c, d) => { const x = c % B.w, y = Math.floor(c / B.w); return [-y, x, y, -x][d]; };
    // one press from positions p: returns { out, land }, or null if nothing moves
    const press = (p, d) => {
      const out = p.slice(), land = p.map(() => false);
      const nd = numDone; // checkpoints taken before this press: both pieces move at once, so one press cannot take two checkpoints
      const seq = p.length === 2 && prog(p[1], d) > prog(p[0], d) ? [1, 0] : p.map((_, k) => k);
      const free = (c, k) => c >= 0 && !out.some((q, j) => j !== k && q === c) &&
        (B.type[c] === ICE || B.type[c] === PERM || (B.type[c] === TILE && !own[c] && (!B.num[c] || B.num[c] === nd + 1)));
      for (const k of seq) {
        let q = B.nb(out[k], d);
        if (!free(q, k)) continue;
        if (B.type[q] === ICE) {
          for (;;) { const r = B.nb(q, d); if (!free(r, k)) break; q = r; if (B.type[r] !== ICE) break; }
        }
        out[k] = q;
        land[k] = B.type[q] === TILE;
      }
      return out.some((q, k) => q !== p[k]) ? { out, land } : null;
    };
    // every event (a press that uses new tiles) reachable through free moves on ice and crossings
    const events = () => {
      const key = (p) => p.slice().sort((x, y) => x - y).join();
      const seen = new Set([key(pos)]), q = [pos], out = [];
      while (q.length) {
        const p = q.shift();
        for (let d = 0; d < 4; d++) {
          const r = press(p, d);
          if (!r) continue;
          if (r.land.some(Boolean)) out.push(r.out.filter((c, k) => r.land[k]).sort((x, y) => x - y).join());
          else if (!seen.has(key(r.out))) { seen.add(key(r.out)); q.push(r.out); }
        }
      }
      return out;
    };
    const dist = (p, q) => Math.abs(p % B.w - q % B.w) + Math.abs(Math.floor(p / B.w) - Math.floor(q / B.w));
    let durs = pos.map(() => 90);
    return {
      B, input: 'dir', two, solution: lv.dirs || '', revealStep: two ? 340 : 360,
      used: () => used,
      moves: () => hist.length,
      canUndo: () => hist.length > 0,
      won: () => used === B.n,
      canDir: (d) => press(pos, d) !== null,
      stuck() { return !this.won() && events().length === 0; },
      dir(d) {
        const r = press(pos, d);
        if (!r) return { ok: false };
        hist.push({ d, prev: pos, land: r.land });
        r.out.forEach((c, k) => { if (r.land[k]) { own[c] = k + 1; used++; order[c] = hist.length; if (B.num[c]) numDone++; } });
        durs = r.out.map((c, k) => 60 + 55 * dist(pos[k], c));
        const blocked = two && r.out[0] === pos[0] ? 0 : two && r.out[1] === pos[1] ? 1 : -1;
        pos = r.out;
        return { ok: true, blocked };
      },
      undo() {
        const h = hist.pop();
        if (!h) return;
        pos.forEach((c, k) => { if (h.land[k]) { own[c] = 0; used--; if (B.num[c]) numDone--; } });
        durs = pos.map(() => 90);
        pos = h.prev;
      },
      pieces: () => pos,
      solverState() {
        const used = [];
        for (let c = 0; c < B.N; c++) if (own[c]) used.push(c);
        return { used, pos: pos.slice() };
      },
      stuckMsg: (left) => left === 1 ? 'So close! One tile left, but it cannot be reached.' : `Stuck: none of the ${left} remaining tiles can be reached.`,
      serialize: () => hist.map(h => DIRS[h.d]).join(''),
      scene() {
        const next = [];
        for (let d = 0; d < 4; d++) {
          const r = press(pos, d);
          if (r) r.out.forEach((c, k) => { if (c !== pos[k]) next.push([c, k ? 'b' : 'a']); });
        }
        const trails = starts.map(s => [s]);
        hist.forEach((h, i) => {
          const after = i + 1 < hist.length ? hist[i + 1].prev : pos;
          after.forEach((c, k) => { if (c !== h.prev[k]) trails[k].push(c); });
        });
        let numNext = -1;
        for (let c = 0; c < B.N; c++) if (B.num[c] === numDone + 1) numNext = c;
        return {
          own, order, next, numNext,
          trails: trails.map((t, k) => [k ? 'b' : 'a', t]),
          pieces: pos.map((c, k) => [k ? 'b' : 'a', c, durs[k]]),
          rings: starts.map((c, k) => [k ? 'b' : 'a', c]),
        };
      },
    };
  }

  // ---------- the games ----------
  const GAMES = {
    vej: {
      id: 'vej', name: 'One Path', brand: '<em>One</em> Path', levels: LEVELS_VEJ, make: makeVej,
      rules: 'Visit every tile exactly once. There is only one route from the start.',
      card: 'One piece. Step tile by tile and visit every tile exactly once. Tiles disappear behind you.',
      keys: 'Drag your finger or the mouse across the tiles, or use the arrow keys. Drag back, or tap a tile you have visited, to undo.',
    },
    takt: {
      id: 'takt', name: 'Lockstep', brand: '<em>Lock</em><span class="b">step</span>', levels: LEVELS_TAKT, make: makeTakt,
      rules: 'Two pieces, one control. Both move the same way, and a piece that cannot move stays put. Every tile can only be used once.',
      card: 'Two pieces, one control. Both move the same way, and a piece that cannot move stays put.',
      keys: 'Swipe on the board, tap a tile in line with a piece, or use the arrow keys. The dots show where each piece can go.',
    },
    is: {
      id: 'is', name: 'Black Ice', brand: 'Black <span class="ice">Ice</span>', levels: LEVELS_IS, make: makeMix,
      rules: 'Use every tile exactly once. Ice never disappears, but on ice you slide until you hit a tile (and land on it) or something you cannot step on.',
      card: 'One piece and a new surface: ice. It never disappears, but you slide until you hit something.',
      keys: 'Swipe on the board, tap a tile in line with the piece, or use the arrow keys. The dots show where each press takes you.',
    },
    kryds: {
      id: 'kryds', name: 'Crossroads', brand: 'Cross<span class="perm">roads</span>', levels: LEVELS_KRYDS, make: makeMix,
      rules: 'Use every tile exactly once. Crossings (the dark stones) never disappear, so you can cross them as often as you like.',
      card: 'One piece and a new tile: the crossing. It never disappears, so you can cross your own path.',
      keys: 'Swipe on the board, tap a tile in line with the piece, or use the arrow keys. The dots show where each press takes you.',
    },
    post: {
      id: 'post', name: 'Checkpoints', brand: 'Check<em>points</em>', levels: LEVELS_POST, make: makeVej,
      rules: 'Visit every tile exactly once, and take the checkpoints in order: you cannot step on checkpoint 2 before you have stood on checkpoint 1. Checkpoints disappear behind you like any other tile.',
      card: 'One piece and numbered checkpoints that must be taken in order.',
      keys: 'Drag your finger or the mouse across the tiles, or use the arrow keys. The next checkpoint you may take is shown in blue.',
    },
    mester: {
      id: 'mester', name: 'The Gauntlet', brand: 'The <em>Gauntlet</em>', levels: LEVELS_MESTER, make: makeMix,
      rules: 'Everything combined, a few things at a time: two pieces sharing one control, ice you slide on, crossings that never disappear, and checkpoints taken in order. Use every tile exactly once.',
      card: 'Everything combined: two pieces, ice, crossings and checkpoints, mixed in new ways.',
      keys: 'Swipe on the board, tap a tile in line with a piece, or use the arrow keys. When the pieces are in the same line, the front one moves first.',
    },
  };
  const ORDER = ['vej', 'takt', 'is', 'kryds', 'post', 'mester'];

  // ---------- state ----------
  let game = null;     // GAMES[...]
  let li = 0;          // level index
  let G = null;        // active level (variant object)
  let fails = 0, wasStuck = false, hintMsg = null;
  let revealed = false, animTimer = null, armTimer = null;
  let cells = [], ink = null;

  const solvedKey = (g) => `hfeg.solved.${g.id}`;
  function getSolved(g) { try { return new Set(JSON.parse(localStorage.getItem(solvedKey(g)) || '[]')); } catch (e) { return new Set(); } }
  function addSolved(g, id) { const s = getSolved(g); s.add(id); try { localStorage.setItem(solvedKey(g), JSON.stringify([...s])); } catch (e) {} }

  // ---------- home ----------
  function renderHome() {
    const wrap = $('cards');
    wrap.textContent = '';
    for (const id of ORDER) {
      const g = GAMES[id];
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'card';
      card.setAttribute('aria-label', `Play ${g.name}`);
      const hardest = g.levels[g.levels.length - 1];
      const mini = document.createElement('div');
      mini.className = 'mini';
      mini.setAttribute('aria-hidden', 'true');
      if (hardest) {
        mini.style.setProperty('--w', hardest.w);
        mini.style.setProperty('--h', hardest.h);
        hardest.rows.join('').split('').forEach(ch => {
          const s = document.createElement('span');
          const base = ch === '+' || ch === 'a' || ch === 'b' ? 'p' : 't';
          s.className = ch === '.' ? '' : ch === '~' ? 'i' : base + ('SAa'.includes(ch) ? ' sa' : 'Bb'.includes(ch) ? ' sb' : '');
          if (ch >= '1' && ch <= '9') s.textContent = ch;
          mini.appendChild(s);
        });
      }
      const h = document.createElement('h2');
      h.innerHTML = g.brand;
      h.className = 'brand';
      const p = document.createElement('p');
      p.textContent = g.card;
      const meta = document.createElement('div');
      meta.className = 'meta';
      const solved = g.levels.filter(l => getSolved(g).has(l.id)).length;
      meta.innerHTML = `<span>${solved} of ${g.levels.length} solved</span><span class="go">Play →</span>`;
      card.append(mini, h, p, meta);
      card.addEventListener('click', () => openGame(id));
      wrap.appendChild(card);
    }
  }

  function showView(v) {
    $('home').hidden = v !== 'home';
    $('game').hidden = v === 'home';
  }
  // Browser history: going from home to a game adds an entry, so the phone's back button first closes the info
  // panel, then returns to the home page, and only then leaves the site. Our entries are tagged { mine: true }.
  const pushState = (state, url) => { try { history.pushState(state, '', url === undefined ? location.href : url); } catch (e) {} };
  const replaceState = (state, url) => { try { history.replaceState(state, '', url); } catch (e) {} };
  const homeUrl = () => location.pathname + location.search;
  function goHome(fromHistory) {
    // back to an entry we pushed ourselves: let the browser go back, and popstate does the rest
    if (!fromHistory && history.state && history.state.mine && history.state.view !== 'home') { history.back(); return; }
    stopAnim();
    game = null;
    $('infoPanel').hidden = true;
    renderHome();
    showView('home');
    if (!fromHistory) replaceState({ view: 'home', mine: true }, homeUrl());
    window.scrollTo(0, 0);
  }
  function openGame(id, li0, moves, fromHistory) {
    if (!fromHistory) {
      if (!game) pushState({ view: id, mine: true }, '#' + id); // from home: a new entry
      else replaceState({ view: id, mine: true }, '#' + id);    // game to next game: same entry
    }
    game = GAMES[id];
    $('gameName').innerHTML = game.brand;
    $('gameRules').textContent = game.rules;
    $('keys').textContent = game.keys + ' Keyboard: Z undoes, R restarts.';
    $('infoRules').textContent = game.rules;
    $('infoKeys').textContent = game.keys;
    $('infoPanel').hidden = true;
    showView(id);
    const solved = getSolved(game);
    let first = game.levels.findIndex(l => !solved.has(l.id));
    if (first < 0) first = 0;
    loadLevel(Number.isInteger(li0) && game.levels[li0] ? li0 : first, moves);
    window.scrollTo(0, 0);
  }
  function openInfo() {
    $('infoPanel').hidden = false;
    pushState({ view: game.id, info: true, mine: true });
  }
  function closeInfo() {
    if ($('infoPanel').hidden) return;
    if (history.state && history.state.info) history.back(); // popstate hides the panel
    else $('infoPanel').hidden = true;
  }

  // ---------- level ----------
  function renderLevelNav() {
    const nav = $('levels');
    nav.textContent = '';
    const solved = getSolved(game), groups = new Map();
    game.levels.forEach((lv, i) => {
      const key = `${lv.w}×${lv.h}`;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(i);
    });
    for (const [key, idxs] of groups) {
      const g = document.createElement('div');
      g.className = 'group';
      const lab = document.createElement('span');
      lab.className = 'group-label';
      lab.textContent = key;
      g.appendChild(lab);
      idxs.forEach((i, k) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        const done = solved.has(game.levels[i].id);
        btn.className = 'chip' + (done ? ' solved' : '');
        btn.textContent = String(k + 1);
        btn.setAttribute('aria-label', `${key}, level ${k + 1}${done ? ' (solved)' : ''}`);
        if (i === li) btn.setAttribute('aria-current', 'true');
        btn.addEventListener('click', () => loadLevel(i));
        g.appendChild(btn);
      });
      nav.appendChild(g);
    }
  }

  function stopAnim() { if (animTimer) { clearInterval(animTimer); animTimer = null; } }

  function loadLevel(i, restoreMoves) {
    stopAnim();
    revealed = false;
    armed = 0;
    li = i;
    const lv = game.levels[i];
    G = game.make(lv);
    fails = 0; wasStuck = false; hintMsg = null;
    if (typeof restoreMoves === 'string') for (const ch of restoreMoves) if (!G.dir(DIRS.indexOf(ch)).ok) break;

    const board = $('board');
    board.style.setProperty('--w', lv.w);
    board.style.setProperty('--h', lv.h);
    board.style.setProperty('--step', `${Math.max(18, Math.round(1100 / G.B.n))}ms`);
    board.textContent = '';
    board.classList.remove('won', 'stuck');
    board.classList.toggle('path-mode', G.input === 'path');
    $('side').classList.toggle('two', G.two);
    cells = [];
    for (let c = 0; c < G.B.N; c++) {
      const d = document.createElement('div');
      d.className = 'cell ' + ['hole', 'tile', 'ice', 'perm'][G.B.type[c]];
      if (G.B.num[c]) { const s = document.createElement('span'); s.className = 'num'; s.textContent = G.B.num[c]; d.appendChild(s); }
      board.appendChild(d);
      cells.push(d);
    }
    // SVG layer: trails, start rings and pieces (counts come from the variant)
    const sc = G.scene();
    const svg = (tag, attrs) => { const el = document.createElementNS(SVGNS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); return el; };
    const root = svg('svg', { class: 'ink', viewBox: `0 0 ${lv.w} ${lv.h}`, 'aria-hidden': 'true' });
    ink = {
      rings: sc.rings.map(([who, c]) => { const [x, y] = center(c, sc.own); return svg('circle', { class: `ring ring-${who}`, r: 0.33, cx: x, cy: y }); }),
      trails: sc.trails.map(([who]) => svg('polyline', { class: `trail-${who}` })),
      pieces: sc.pieces.map(([who]) => { const g = svg('g', { class: `piece piece-${who}` }); g.appendChild(svg('circle', { r: 0.24, cx: 0, cy: 0 })); return g; }),
    };
    root.append(...ink.rings, ...ink.trails, ...ink.pieces);
    board.appendChild(root);

    const same = game.levels.filter(o => o.w === lv.w && o.h === lv.h);
    $('lvlEyebrow').textContent = `Level ${i + 1} of ${game.levels.length} · ${G.B.n} tiles` + (G.B.ice ? ` + ${G.B.ice} ice` : '') + (G.B.perm ? ` + ${G.B.perm} ${G.B.perm === 1 ? 'crossing' : 'crossings'}` : '');
    $('lvlTitle').textContent = `${lv.w} × ${lv.h}` + (same.length > 1 ? ` · ${same.indexOf(lv) + 1}` : '');
    $('tot').textContent = G.B.n;
    renderLevelNav();
    update();
  }

  // Centre of the tile surface. Used tiles and ice are pressed down (--lift = 0.065 tile); fresh tiles and crossings stand up.
  function center(c, own) {
    const w = game.levels[li].w, t = G.B.type[c];
    const dy = t === ICE ? 0.565 : t === TILE && own && own[c] ? 0.55 : 0.485;
    return [c % w + 0.5, Math.floor(c / w) + dy];
  }
  // Pieces are moved with the SVG transform attribute (consistent across browsers) and glide with requestAnimationFrame.
  function placePiece(el, x, y, dur) {
    cancelAnimationFrame(el._raf);
    const from = el._at;
    const set = (px, py) => { el._at = [px, py]; el.setAttribute('transform', `translate(${px} ${py})`); };
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!from || reduce || (from[0] === x && from[1] === y)) { set(x, y); return; }
    const t0 = performance.now();
    const tick = (now) => {
      const t = Math.min(1, (now - t0) / dur), e = 1 - (1 - t) ** 3;
      set(from[0] + (x - from[0]) * e, from[1] + (y - from[1]) * e);
      if (t < 1) el._raf = requestAnimationFrame(tick);
    };
    el._raf = requestAnimationFrame(tick);
  }
  function nextLevel() {
    if (li < game.levels.length - 1) { loadLevel(li + 1); return; }
    openGame(ORDER[(ORDER.indexOf(game.id) + 1) % ORDER.length]);
  }

  // ---------- actions ----------
  function step(d) {
    if (animTimer || G.won()) return;
    const r = G.dir(d);
    if (!r.ok) return bump();
    hintMsg = null;
    if (!G.canUndo()) revealed = false;
    update(r.blocked);
  }
  function undo(n = 1) {
    if (animTimer || !G.canUndo()) return;
    while (n-- > 0 && G.canUndo()) G.undo();
    if (!G.canUndo()) revealed = false;
    hintMsg = null;
    $('board').classList.remove('won');
    update();
  }
  function restart() { while (G && G.canUndo() && !animTimer) G.undo(); if (G) { revealed = false; hintMsg = null; $('board').classList.remove('won'); update(); } }
  function bump() {
    const board = $('board');
    board.classList.remove('bump');
    void board.offsetWidth;
    board.classList.add('bump');
  }
  // Check route (key H): the engine (MixSolver) works out whether the level can still be solved from here. No stored solution needed.
  let solverCache = null;
  function solvableAfter(moves, k) {
    const lv = game.levels[li];
    if (!solverCache || solverCache.lv !== lv) {
      const p = MixSolver.parseLevel(lv.rows);
      solverCache = { lv, g: MixSolver.buildBoard(lv.w, lv.h, p.types, p.nums), pieces: p.pieces };
    }
    const inst = game.make(lv);
    for (const ch of moves.slice(0, k)) inst.dir(DIRS.indexOf(ch));
    const st = inst.solverState();
    return MixSolver.solvableFrom(solverCache.g, solverCache.pieces, st.used, st.pos);
  }
  function hint() {
    if (G.won() || revealed || animTimer) return;
    const moves = G.serialize();
    if (!moves.length) { hintMsg = ['good', 'You are at the start. Every route is still open.']; update(); return; }
    hintMsg = ['', 'Checking your route …'];
    update();
    setTimeout(() => {
      const now = solvableAfter(moves, moves.length);
      let msg;
      if (now === null) msg = ['', 'This level is too big to check from here. Try again a little later in the level.'];
      else if (now) msg = ['good', 'You are still on the only route.'];
      else {
        // the latest position from which the level can still be solved (always true at the start)
        let lo = 0, hi = moves.length;
        while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (solvableAfter(moves, mid) === false) hi = mid; else lo = mid; }
        msg = ['bad', `It went wrong at move ${lo + 1}. Undo ${moves.length - lo} ${moves.length - lo === 1 ? 'move' : 'moves'}.`];
      }
      // the answer only applies if the player has not moved in the meantime
      hintMsg = G.serialize() === moves ? msg : null;
      update();
    }, 30);
  }
  let armed = 0;
  function revealKey() {
    if (PUBLIC || revealed || animTimer || G.won()) return;
    if (Date.now() - armed > 3000) { armed = Date.now(); hintMsg = ['', 'Press L again to show the solution.']; update(); return; }
    armed = 0;
    hintMsg = null;
    revealed = true;
    $('board').classList.remove('won');
    while (G.canUndo()) G.undo();
    const sol = G.solution;
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { for (const ch of sol) G.dir(DIRS.indexOf(ch)); update(); return; }
    let k = 0;
    animTimer = setInterval(() => {
      G.dir(DIRS.indexOf(sol[k++]));
      if (k >= sol.length) stopAnim();
      update();
    }, G.revealStep);
    update();
  }

  // ---------- rendering ----------
  function update(blocked) {
    const board = $('board');
    const won = G.won();
    const stuck = !won && G.stuck();
    if (stuck && !wasStuck) fails++;
    wasStuck = stuck;

    const sc = G.scene();
    for (let c = 0; c < cells.length; c++) {
      const t = G.B.type[c];
      if (t !== TILE) { cells[c].className = 'cell ' + ['hole', 'tile', 'ice', 'perm'][t]; continue; }
      cells[c].className = 'cell tile' + (sc.own[c] === 1 ? ' used-a' : sc.own[c] === 2 ? ' used-b' : '') +
        (G.B.num[c] ? ' has-num' : '') + (sc.numNext === c ? ' num-next' : '');
      cells[c].style.setProperty('--i', sc.order[c]);
    }
    if (!won && !animTimer) for (const [c, who] of sc.next) cells[c].classList.add('next-' + who);
    sc.trails.forEach(([, path], k) => ink.trails[k].setAttribute('points', path.map(c => center(c, sc.own).join(',')).join(' ')));
    sc.pieces.forEach(([, c, dur], k) => {
      const [x, y] = center(c, sc.own), el = ink.pieces[k];
      placePiece(el, x, y, dur || 90);
      el.classList.remove('blocked');
      if (blocked === k) { void el.getBoundingClientRect(); el.classList.add('blocked'); }
    });

    board.classList.toggle('stuck', stuck);
    board.classList.toggle('revealed', revealed);
    if (won && !revealed && !board.classList.contains('won')) {
      board.classList.add('won');
      const lv = game.levels[li];
      if (!getSolved(game).has(lv.id)) { addSolved(game, lv.id); renderLevelNav(); }
    }

    const used = G.used(), n = G.B.n, left = n - used;
    $('cnt').textContent = used;
    $('moves').textContent = G.moves();
    $('bar').style.width = `${(used / n) * 100}%`;
    $('fails').textContent = fails ? `stuck ${fails}×` : '';
    const rb = $('restart');
    rb.classList.toggle('go', won);
    rb.classList.toggle('alert', stuck);
    rb.textContent = won ? (li < game.levels.length - 1 ? 'Next level →' : 'Next game →') : 'Restart';

    let cls = '', msg = '';
    if (revealed) msg = animTimer ? 'Showing the solution …' : 'Here is the only solution. Press Restart to try it yourself.';
    else if (won) {
      cls = 'good';
      msg = fails === 0 ? 'Solved on the first try!' : `Solved! Stuck ${fails}× along the way.`;
    } else if (stuck) { cls = 'bad'; msg = G.stuckMsg(left); }
    else if (hintMsg) [cls, msg] = hintMsg;
    else msg = `${left} ${left === 1 ? 'tile' : 'tiles'} left.`;
    const st = $('status');
    st.className = 'status' + (cls ? ' ' + cls : '');
    st.textContent = msg;
  }

  // ---------- input ----------
  const board = $('board');
  let down = null, dragging = false;
  function cellAt(e, strict) {
    const lv = game.levels[li], r = board.getBoundingClientRect();
    const fx = ((e.clientX - r.left) / r.width) * lv.w, fy = ((e.clientY - r.top) / r.height) * lv.h;
    const x = Math.floor(fx), y = Math.floor(fy);
    if (x < 0 || y < 0 || x >= lv.w || y >= lv.h) return -1;
    if (strict && (Math.abs(fx - x - 0.5) > 0.36 || Math.abs(fy - y - 0.5) > 0.36)) return -1;
    return y * lv.w + x;
  }
  board.addEventListener('pointerdown', (e) => {
    if (!G || (e.button !== undefined && e.button !== 0)) return;
    try { board.setPointerCapture(e.pointerId); } catch (err) {}
    down = { x: e.clientX, y: e.clientY };
    if (G.input === 'path' && !animTimer && !G.won()) {
      dragging = true;
      if (G.touch(cellAt(e, false), true)) { hintMsg = null; update(); }
    }
  });
  board.addEventListener('pointermove', (e) => {
    if (dragging && !animTimer && !G.won() && G.touch(cellAt(e, true), false)) { hintMsg = null; update(); }
  });
  board.addEventListener('pointerup', (e) => {
    dragging = false;
    if (!down || !G || G.input !== 'dir') { down = null; return; }
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    down = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 24) return step(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
    // tapping a tile in line with a piece = that direction
    const c = cellAt(e, false), w = game.levels[li].w;
    if (c < 0) return;
    for (const p of G.pieces()) {
      const px = p % w, py = Math.floor(p / w), cx = c % w, cy = Math.floor(c / w);
      if (p === c) continue;
      if (px === cx) return step(cy < py ? 0 : 2);
      if (py === cy) return step(cx > px ? 1 : 3);
    }
  });
  board.addEventListener('pointercancel', () => { down = null; dragging = false; });

  const KEYDIR = { arrowup: 0, w: 0, arrowright: 1, d: 1, arrowdown: 2, s: 2, arrowleft: 3, a: 3 };
  document.addEventListener('keydown', (e) => {
    if (!G || $('game').hidden || e.altKey || e.metaKey) return;
    if (!$('infoPanel').hidden) { if (e.key === 'Escape') closeInfo(); return; }
    const k = e.key.toLowerCase();
    if (e.ctrlKey && k !== 'z') return;
    if (k in KEYDIR) { e.preventDefault(); step(KEYDIR[k]); return; }
    if (k === 'z' || k === 'backspace' || k === 'u') { e.preventDefault(); undo(); }
    else if (k === 'r') restart();
    else if (k === 'h') hint();
    else if (k === 'l') revealKey();
    else if ((k === 'n' || k === 'enter') && G.won()) nextLevel();
    else if (k === 'escape') goHome();
  });
  $('restart').addEventListener('click', () => { if (G && G.won()) nextLevel(); else restart(); });
  $('info').addEventListener('click', openInfo);
  $('infoPanel').addEventListener('click', closeInfo);
  $('back').addEventListener('click', () => goHome());

  // ---------- start ----------
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') {
    try { hot.snapshot(() => (game ? { view: game.id, li, moves: G ? G.serialize() : '' } : { view: 'home' })); } catch (e) {}
  }
  const boot = (data) => {
    const d = data || {};
    let view = d.view;
    if (!view) { const hv = (location.hash || '').slice(1); if (GAMES[hv]) view = hv; }
    // the home page always sits at the bottom of our history, also when arriving via a link to a game
    replaceState({ view: 'home', mine: true }, homeUrl());
    if (view && GAMES[view]) {
      pushState({ view, mine: true }, '#' + view);
      openGame(view, d.li, d.moves, true);
    } else goHome(true);
  };
  if (hot && typeof hot.ready === 'function') hot.ready(boot);
  else boot(hot && hot.data ? hot.data : {});
  // back/forward in the browser (and the phone's back button)
  window.addEventListener('popstate', (e) => {
    const st = e.state || {};
    if (!st.info) $('infoPanel').hidden = true;
    const hv = (location.hash || '').slice(1);
    if (GAMES[hv]) { if (!game || game.id !== hv) openGame(hv, undefined, undefined, true); }
    else if (game) goHome(true);
  });
})();
</script>
